<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Planora — plan clearly, ship calmly</title>
  <desc id="desc">A dark planning workspace showing the goal-to-insight loop and a schematic dashboard.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="-10%" r="70%">
      <stop offset="0" stop-color="#2ed6c3" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2ed6c3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76e3d5"/>
      <stop offset="1" stop-color="#2bbda9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1925"/>
      <stop offset="1" stop-color="#08121d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43d6c5"/>
      <stop offset="1" stop-color="#76e3d5"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <style>
      .word{font-family:"Manrope","Segoe UI",system-ui,sans-serif;font-weight:800}
      .sans{font-family:"DM Sans","Segoe UI",system-ui,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
    </style>
  </defs>

  <rect width="1200" height="630" fill="#050b12"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1040" cy="64" r="150" fill="#2ed6c3" opacity="0.10" filter="url(#soft)"/>

  <g transform="translate(72 64)">
    <rect width="44" height="44" rx="14" fill="url(#accent)"/>
    <text x="22" y="30" text-anchor="middle" class="word" font-size="22" fill="#04140f">P</text>
    <text x="60" y="31" class="word" font-size="25" letter-spacing="2" fill="#eef7f9">planora</text>
  </g>

  <text x="72" y="214" class="word" font-size="74" fill="#f2f8fa" letter-spacing="-2">Plan clearly.</text>
  <text x="72" y="296" class="word" font-size="74" fill="#76e3d5" letter-spacing="-2">Ship calmly.</text>
  <text x="74" y="352" class="sans" font-size="23" fill="#8da4af">A goal-first workspace for the week that keeps changing.</text>

  <g transform="translate(72 406)" class="mono" font-size="12">
    <g>
      <rect width="64" height="30" rx="15" fill="#0d1d29" stroke="#1d3445"/>
      <text x="32" y="19" text-anchor="middle" fill="#cfdde2">goal</text>
    </g>
    <text x="72" y="19" fill="#3f6a70">→</text>
    <g transform="translate(88 0)">
      <rect width="58" height="30" rx="15" fill="#0d1d29" stroke="#1d3445"/>
      <text x="29" y="19" text-anchor="middle" fill="#cfdde2">plan</text>
    </g>
    <text x="154" y="19" fill="#3f6a70">→</text>
    <g transform="translate(170 0)">
      <rect width="96" height="30" rx="15" fill="#0d1d29" stroke="#1d3445"/>
      <text x="48" y="19" text-anchor="middle" fill="#cfdde2">milestones</text>
    </g>
    <text x="274" y="19" fill="#3f6a70">→</text>
    <g transform="translate(290 0)">
      <rect width="60" height="30" rx="15" fill="#0d1d29" stroke="#1d3445"/>
      <text x="30" y="19" text-anchor="middle" fill="#cfdde2">tasks</text>
    </g>
    <text x="358" y="19" fill="#3f6a70">→</text>
    <g transform="translate(374 0)">
      <rect width="84" height="30" rx="15" fill="#0d1d29" stroke="#1d3445"/>
      <text x="42" y="19" text-anchor="middle" fill="#cfdde2">schedule</text>
    </g>
    <text x="466" y="19" fill="#3f6a70">→</text>
    <g transform="translate(482 0)">
      <rect width="72" height="30" rx="15" fill="#0d1d29" stroke="#1d3445"/>
      <text x="36" y="19" text-anchor="middle" fill="#cfdde2">insights</text>
    </g>
  </g>

  <g transform="translate(760 96)">
    <rect width="368" height="446" rx="22" fill="url(#panel)" stroke="#1d3445" stroke-width="1.5"/>
    <rect x="20" y="20" width="328" height="52" rx="12" fill="#0b1723" stroke="#1b3041"/>
    <circle cx="44" cy="46" r="11" fill="url(#accent)" opacity="0.9"/>
    <rect x="64" y="38" width="118" height="7" rx="3.5" fill="#dbe8ea" opacity="0.92"/>
    <rect x="64" y="51" width="72" height="5" rx="2.5" fill="#6f8794"/>
    <rect x="268" y="34" width="58" height="24" rx="12" fill="#12433f" stroke="#2a6b64"/>

    <g transform="translate(20 90)">
      <rect width="156" height="92" rx="13" fill="#0b1723" stroke="#1b3041"/>
      <text x="16" y="30" class="sans" font-size="11" fill="#8da4af">Overall progress</text>
      <text x="16" y="66" class="word" font-size="27" fill="#eef7f9">62%</text>
      <rect x="16" y="76" width="124" height="6" rx="3" fill="#16313d"/>
      <rect x="16" y="76" width="78" height="6" rx="3" fill="url(#bar)"/>
    </g>
    <g transform="translate(192 90)">
      <rect width="156" height="92" rx="13" fill="#0b1723" stroke="#1b3041"/>
      <text x="16" y="30" class="sans" font-size="11" fill="#8da4af">Due today</text>
      <text x="16" y="66" class="word" font-size="27" fill="#eef7f9">3</text>
      <text x="16" y="82" class="sans" font-size="10" fill="#78e4b6">on track</text>
    </g>

    <g transform="translate(20 198)">
      <rect width="328" height="228" rx="14" fill="#09131e" stroke="#1b3041"/>
      <text x="16" y="28" class="sans" font-size="12" fill="#cfdde2">Product launch</text>
      <text x="312" y="28" text-anchor="end" class="mono" font-size="10" fill="#78e4b6">On track</text>
      <g transform="translate(16 44)">
        <rect width="72" height="170" rx="10" fill="#0c1a26" stroke="#183042"/>
        <rect x="10" y="12" width="52" height="26" rx="6" fill="#102433"/>
        <rect x="10" y="46" width="52" height="34" rx="6" fill="#102433"/>
        <rect x="10" y="88" width="52" height="34" rx="6" fill="#102433"/>
        <rect x="10" y="130" width="52" height="26" rx="6" fill="#102433"/>
      </g>
      <g transform="translate(98 44)">
        <rect width="72" height="170" rx="10" fill="#0c1a26" stroke="#183042"/>
        <rect x="10" y="12" width="52" height="34" rx="6" fill="#113029"/>
        <rect x="10" y="54" width="52" height="26" rx="6" fill="#102433"/>
        <rect x="10" y="88" width="52" height="34" rx="6" fill="#102433"/>
      </g>
      <g transform="translate(180 44)">
        <rect width="72" height="170" rx="10" fill="#0c1a26" stroke="#183042"/>
        <rect x="10" y="12" width="52" height="26" rx="6" fill="#102433"/>
        <rect x="10" y="46" width="52" height="34" rx="6" fill="#302a1a"/>
        <rect x="10" y="88" width="52" height="26" rx="6" fill="#102433"/>
        <rect x="10" y="122" width="52" height="34" rx="6" fill="#102433"/>
      </g>
      <g transform="translate(262 44)">
        <rect width="50" height="170" rx="10" fill="#0c1a26" stroke="#183042"/>
        <rect x="9" y="12" width="32" height="26" rx="6" fill="#113029"/>
        <rect x="9" y="46" width="32" height="26" rx="6" fill="#102433"/>
      </g>
    </g>
  </g>

  <text x="72" y="560" class="sans" font-size="15" fill="#6f8794">React · TypeScript · Express · Firebase-ready · four dark appearances</text>
  <g transform="translate(72 578)">
    <rect width="54" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
